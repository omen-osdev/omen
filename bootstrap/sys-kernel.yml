packages:
  - name: kernel
    tools_required:
      - host-gcc
      - host-binutils
    source:
      subdir: 'src'
    build:
      - args: 
        - 'make'
        - '-C'
        - '@SOURCE_ROOT@/buildenv/'
        - 'kernel'
        environ:
          CC: "@OPTION:cc@"
          CXX: "@OPTION:cxx@"
          LD: "@OPTION:ld@"
          ASMC: "@OPTION:asmc@"